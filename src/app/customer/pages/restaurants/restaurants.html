<h2>Available Restaurants</h2>

<div *ngIf="restaurants.length > 0; else loading">

  <div class="restaurant-list">
    <div *ngFor="let r of restaurants; trackBy: trackById"
         style="border: 1px solid #ccc; margin: 10px; padding: 10px;">

      <h3>{{ r.name }}</h3>
      <p><strong>Cuisine:</strong> {{ r.cuisine }}</p>
      <p><strong>Rating:</strong> {{ r.rating }} ⭐</p>
      <p><strong>Delivery:</strong> {{ r.delivery_minutes }} min</p>
      <p><strong>Distance:</strong> {{ r.distance_km }} km</p>

      <button [routerLink]="['/customer/restaurants', r.id]">
        View Menu
      </button>

    </div>
  </div>

</div>

<ng-template #loading>
  <p>Loading restaurants...</p>
</ng-template>
