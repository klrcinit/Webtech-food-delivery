<div class="auth-container">
  <div class="auth-card">

  <h2>Login</h2>

  <input
    name="email"
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
  />

  <input
    name="password"
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button type="button" (click)="login()">
    Login
  </button>

    <div class="error" *ngIf="errorMessage">
      ⚠ {{ errorMessage }}
  </div>

  <p>
    Don't have an account?
    <a routerLink="/customer/register">Register</a>
  </p>

  <a routerLink="/customer/forgot-password">Forgot password?</a>

</div>
</div>
